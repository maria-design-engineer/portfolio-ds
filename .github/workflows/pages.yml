# Собирает витрину Storybook и публикует её на GitHub Pages.
# Запускается отправкой тега вида v* — на адресе всегда стоит названный релиз
# (решение в ds-plan.md, «Архитектурные решения»). Ручной запуск оставлен на случай
# пересборки без нового тега. Версии шагов точные: плавающий тег однажды
# приедет другой версией и сломает сборку без единой правки в проекте.
name: Storybook to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.16.0

      # Зависимости по файлу замка, а не свежие: иначе у автосборки свой
      # набор версий и витрина на адресе отличается от локальной.
      - name: Install
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  # Пакет для сайта: архив npm pack прикладывается к релизу GitHub с номером тега.
  # Сайт ставит собранный пакет по адресу архива, исходники библиотеки ему не нужны.
  release:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.16.0

      - name: Install
        run: npm ci

      # Номер в package.json обязан совпадать с тегом: иначе архив назовётся
      # не тем номером, и сайт поставит не тот релиз.
      - name: Version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "package.json: $PKG_VERSION, тег: $GITHUB_REF_NAME — номера расходятся"
            exit 1
          fi

      - name: Build package
        run: npm run build

      - name: Pack
        run: npm pack

      # gh приезжает с образом ubuntu-24.04, отдельной версии у шага нет.
      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Пакет ds $GITHUB_REF_NAME: архив для npm install по адресу ниже."
          gh release upload "$GITHUB_REF_NAME" ds-*.tgz --clobber
